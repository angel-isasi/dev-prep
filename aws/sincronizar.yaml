AWSTemplateFormatVersion: "2010-09-09"
Description: >
  dev-prep: guarda el progreso de cada dispositivo (laptop y celular) para unirlo y manda los
  avisos diarios. Una Lambda con URL propia (sin API Gateway), una tabla DynamoDB y una regla
  que la despierta cada 30 minutos. Todo dentro del nivel gratuito permanente de AWS.
  Se crea con "npm run aws:crear" y se borra con "npm run aws:borrar".

Parameters:
  Token:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Token secreto que deben enviar la laptop y el celular (lo genera scripts/aws-sync.js).
  VapidPublica:
    Type: String
    Default: ""
    Description: Clave pública de los avisos (la genera scripts/aws-sync.js).
  VapidPrivada:
    Type: String
    NoEcho: true
    Default: ""
    Description: Clave privada de los avisos (la genera scripts/aws-sync.js; nunca va al repo).

Resources:
  # Un registro por dispositivo: { dispositivo, actualizado, doc (JSON comprimido con gzip) }
  Tabla:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: devprep-progreso
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 5, WriteCapacityUnits: 5 } # 25 + 25 gratis siempre
      AttributeDefinitions:
        - { AttributeName: dispositivo, AttributeType: S }
      KeySchema:
        - { AttributeName: dispositivo, KeyType: HASH }

  Registros:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/devprep-sincronizar
      RetentionInDays: 7

  Rol:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: devprep-tabla-y-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Scan, dynamodb:GetItem, dynamodb:DeleteItem]
                Resource: !GetAtt Tabla.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${Registros.Arn}:*"

  Funcion:
    Type: AWS::Lambda::Function
    DependsOn: Registros
    Properties:
      FunctionName: devprep-sincronizar
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt Rol.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLA: !Ref Tabla
          TOKEN: !Ref Token
          VAPID_PUBLICA: !Ref VapidPublica
          VAPID_PRIVADA: !Ref VapidPrivada
      # El código real (aws/lambda/index.js empaquetado) lo sube scripts/aws-sync.js después de
      # desplegar. Esto es solo el punto de partida: si alguien lo ve, responde "no disponible".
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 503, body: JSON.stringify({ error: "Actualizando, vuelve en un minuto" }) });


  Url:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Funcion.Arn
      AuthType: NONE # la protección es el token secreto
      Cors:
        AllowOrigins:
          - https://dev-prep.angel-isasi.com
          - http://localhost:4173
          - http://localhost:5174
        AllowMethods: [GET, PUT, POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 86400

  PermisoUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Funcion
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  PermisoInvocar:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Funcion
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # Cada 30 minutos la Lambda revisa si toca mandar un aviso (server/avisos.js)
  Reloj:
    Type: AWS::Events::Rule
    Properties:
      Name: devprep-avisos
      ScheduleExpression: rate(30 minutes)
      State: ENABLED
      Targets:
        - { Arn: !GetAtt Funcion.Arn, Id: avisos }

  PermisoReloj:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Funcion
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt Reloj.Arn

Outputs:
  Url:
    Description: URL de la función (va en data/sync.json y en el QR para el celular)
    Value: !GetAtt Url.FunctionUrl

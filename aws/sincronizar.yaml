AWSTemplateFormatVersion: "2010-09-09"
Description: >
  dev-prep: guarda el progreso de cada dispositivo (laptop y celular) para unirlo.
  Una Lambda con URL propia (sin API Gateway) y una tabla DynamoDB. Todo dentro del
  nivel gratuito permanente de AWS. Se crea con "npm run aws:crear" y se borra con "npm run aws:borrar".

Parameters:
  Token:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Token secreto que deben enviar la laptop y el celular (lo genera scripts/aws-sync.js).

Resources:
  # Un registro por dispositivo: { dispositivo, actualizado, doc (JSON comprimido con gzip) }
  Tabla:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: devprep-progreso
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 5, WriteCapacityUnits: 5 } # 25 + 25 gratis siempre
      AttributeDefinitions:
        - { AttributeName: dispositivo, AttributeType: S }
      KeySchema:
        - { AttributeName: dispositivo, KeyType: HASH }

  Registros:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/devprep-sincronizar
      RetentionInDays: 7

  Rol:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: devprep-tabla-y-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Scan]
                Resource: !GetAtt Tabla.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${Registros.Arn}:*"

  Funcion:
    Type: AWS::Lambda::Function
    DependsOn: Registros
    Properties:
      FunctionName: devprep-sincronizar
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt Rol.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLA: !Ref Tabla
          TOKEN: !Ref Token
      Code:
        ZipFile: |
          // GET: devuelve los documentos de todos los dispositivos. PUT: guarda el de un dispositivo.
          const { DynamoDBClient, PutItemCommand, ScanCommand } = require("@aws-sdk/client-dynamodb");
          const zlib = require("zlib");
          const crypto = require("crypto");
          const db = new DynamoDBClient({});
          const MAX = 300 * 1024;
          const resp = (statusCode, body) => ({ statusCode, headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
          const hash = (t) => crypto.createHash("sha256").update(t).digest();
          function autorizado(h) {
            const t = String(h.authorization || "").replace(/^Bearer /, "");
            return t.length > 0 && crypto.timingSafeEqual(hash(t), hash(process.env.TOKEN));
          }
          exports.handler = async (event) => {
            const metodo = event.requestContext && event.requestContext.http && event.requestContext.http.method;
            if (!autorizado(event.headers || {})) return resp(401, { error: "No autorizado" });
            if (metodo === "GET") {
              const r = await db.send(new ScanCommand({ TableName: process.env.TABLA }));
              const documentos = (r.Items || []).map((i) => ({
                dispositivo: i.dispositivo.S,
                actualizado: i.actualizado.S,
                doc: JSON.parse(zlib.gunzipSync(Buffer.from(i.doc.B)).toString()),
              }));
              return resp(200, { documentos });
            }
            if (metodo === "PUT") {
              const texto = event.isBase64Encoded ? Buffer.from(event.body || "", "base64").toString() : event.body || "{}";
              let cuerpo;
              try { cuerpo = JSON.parse(texto); } catch (e) { return resp(400, { error: "JSON inválido" }); }
              const dispositivo = String(cuerpo.dispositivo || "");
              if (!/^[a-z0-9-]{3,40}$/.test(dispositivo)) return resp(400, { error: "Dispositivo inválido" });
              const comprimido = zlib.gzipSync(JSON.stringify(cuerpo.doc || {}));
              if (comprimido.length > MAX) return resp(413, { error: "El documento es demasiado grande" });
              const actualizado = new Date().toISOString();
              await db.send(new PutItemCommand({
                TableName: process.env.TABLA,
                Item: { dispositivo: { S: dispositivo }, actualizado: { S: actualizado }, doc: { B: comprimido } },
              }));
              return resp(200, { actualizado });
            }
            return resp(405, { error: "Método no permitido" });
          };

  Url:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Funcion.Arn
      AuthType: NONE # la protección es el token secreto
      Cors:
        AllowOrigins:
          - https://dev-prep.angel-isasi.com
          - http://localhost:4173
          - http://localhost:5174
        AllowMethods: [GET, PUT]
        AllowHeaders: [authorization, content-type]
        MaxAge: 86400

  PermisoUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Funcion
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  PermisoInvocar:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Funcion
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  Url:
    Description: URL de la función (va en data/sync.json y en el QR para el celular)
    Value: !GetAtt Url.FunctionUrl
